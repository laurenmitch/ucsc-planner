<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slug Planner</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="loading-screen" class="full-screen-state" role="status" aria-live="polite">
  <p class="loading-text" id="loading-text"></p>
</div>

<div id="error-screen" class="full-screen-state" hidden>
  <p class="error-text" id="error-message">Something went wrong loading the schedule.</p>
  <button type="button" id="retry-btn" class="btn btn-primary">RETRY</button>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="topbar-side topbar-left">SLUG PLANNER</div>
    <div class="topbar-center">
      <label class="sr-only" for="term-select">Quarter</label>
      <select id="term-select" class="select"></select>
      <button type="button" id="add-class-btn" class="btn btn-primary">ADD CLASS →</button>
    </div>
  </header>

  <div class="layout">
    <main class="plan-area" id="plan-area-outer">
      <button type="button" id="plan-prev" class="plan-nav plan-nav-prev" aria-label="Previous plan">‹</button>

      <div class="plan-track" id="plan-track">
      <div class="plan-ghost plan-ghost-prev" id="plan-ghost-prev" aria-hidden="true" hidden></div>
      <div class="plan-content" id="plan-content">
        <div class="plan-head">
          <h1 class="plan-name" id="plan-name" contenteditable="true" role="textbox" aria-label="Plan name" spellcheck="false"></h1>
          <p class="plan-summary" id="plan-summary">EMPTY</p>
        </div>

        <div class="calendar" id="calendar">
          <div class="calendar-frame">
            <div class="calendar-header">
              <div class="calendar-gutter-header"></div>
              <div class="calendar-day-header">SUN</div>
              <div class="calendar-day-header">MON</div>
              <div class="calendar-day-header">TUE</div>
              <div class="calendar-day-header">WED</div>
              <div class="calendar-day-header">THU</div>
              <div class="calendar-day-header">FRI</div>
              <div class="calendar-day-header">SAT</div>
            </div>
            <div class="calendar-body" id="calendar-body">
              <div class="calendar-gutter" id="calendar-gutter"></div>
              <div id="calendar-grid"></div>
            </div>
          </div>
        </div>

        <div class="plan-bar">
          <div class="plan-bar-left">
            <div class="plan-counter" id="plan-counter">1 / 1</div>
            <button type="button" id="plan-reorder-btn" class="btn" hidden>REORDER</button>
            <div id="reorder-panel" class="reorder-panel" hidden aria-hidden="true" role="dialog" aria-label="Reorder plans">
              <div class="reorder-header">
                <button type="button" id="reorder-done" class="btn btn-primary">DONE</button>
              </div>
              <div class="reorder-list" id="reorder-list"></div>
            </div>
          </div>
          <div class="plan-actions">
            <button type="button" id="plan-add" class="btn btn-primary">+ MAKE A PLAN B</button>
            <button type="button" id="plan-duplicate" class="btn">DUPLICATE</button>
            <button type="button" id="plan-delete" class="btn">CLEAR PLAN</button>
          </div>
        </div>
      </div>
      <div class="plan-ghost plan-ghost-next" id="plan-ghost-next" aria-hidden="true" hidden></div>
      </div>

      <button type="button" id="plan-next" class="plan-nav plan-nav-next" aria-label="Next plan">›</button>
    </main>

    <aside class="class-bank" id="class-bank" aria-label="Class bank">
      <div class="bank-header">
        <h2>CLASS BANK</h2>
        <p class="bank-hint">DRAG A SECTION ONTO A PLAN →</p>
      </div>
      <div class="bank-list" id="bank-list"></div>
    </aside>
  </div>
</div>

<div id="drawer-dim" class="drawer-dim" hidden></div>
<div id="drawer" class="drawer" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="drawer-heading">
  <div class="drawer-header">
    <h2 id="drawer-heading">ADD A CLASS</h2>
    <button type="button" id="drawer-close" class="icon-btn" aria-label="Close">✕</button>
  </div>
  <div class="drawer-controls">
    <label class="sr-only" for="subject-select">Subject</label>
    <select id="subject-select" class="select"></select>
    <label class="sr-only" for="search-input">Search courses</label>
    <input type="search" id="search-input" class="input" placeholder="SEARCH COURSE OR TITLE">
  </div>
  <div class="drawer-list" id="drawer-list"></div>
</div>

<div id="popover-layer" hidden></div>

<div class="sammy-strip" aria-hidden="false">
  <button type="button" id="sammy" class="sammy" aria-label="Sammy the banana slug. Poke him to say hi.">
    <span class="sammy-squish">
      <svg class="sammy-svg" viewBox="0 0 64 40" aria-hidden="true" focusable="false">
        <path class="sammy-trail" d="M2 33 Q16 31 30 32 T58 31" fill="none" stroke="#e8c51a" stroke-opacity="0.3" stroke-width="4" stroke-linecap="round"></path>
        <path class="sammy-body" d="M5 31 C4 21 11 14 21 13 C31 12 41 12 49 16 C57 19 61 23 60 28 C59 34 50 37 38 37 C25 37 5 37 5 31 Z" fill="#e8c51a" stroke="#000000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
        <path class="sammy-mantle" d="M39 15 C47 15 55 18 59 25 C59 29 54 31 48 31 C41 31 38 26 38 20 C38 18 38 16 39 15 Z" fill="#c2a318" stroke="#000000" stroke-width="2" stroke-linejoin="round"></path>
        <circle class="sammy-hole" cx="49" cy="21" r="1.6" fill="#000000"></circle>
        <g class="sammy-eyestalks">
          <path d="M53 15 C55 9 57 5 57 2" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"></path>
          <circle cx="57" cy="2" r="2.1" fill="#000000"></circle>
          <path d="M47 15 C48 8 49 4 49 1" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"></path>
          <circle cx="49" cy="1" r="2.1" fill="#000000"></circle>
        </g>
      </svg>
    </span>
    <span class="sammy-bubble" id="sammy-bubble" role="status" aria-live="polite" hidden></span>
  </button>
</div>

<script src="app.js"></script>
</body>
</html>
