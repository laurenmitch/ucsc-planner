name: Scrape UCSC classes

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC), off the hour to avoid the top-of-hour rush
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape current and future terms
        run: python3 scraper/scrape.py --out data

      - name: Commit updated data
        run: |
          git config user.name "ucsc-planner-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
